name: Desplegar

# Al mergear a main, cuando el CI termina en verde, despliega en la cuenta de Cloudflare del proyecto solo lo que el
# merge cambió (scripts/que-desplegar.ts): el bot con sus migraciones, la landing, los dos o nada. Un merge de solo
# documentación o tests no despliega. Nadie más necesita acceso a Cloudflare: basta con mergear.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez, y nunca se cancela uno a medias.
concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produccion:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El entorno guarda el token y la cuenta; solo main puede usarlo (Settings → Environments → produccion).
    environment: produccion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: ¿Está configurado el entorno?
        id: listo
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Falta CLOUDFLARE_API_TOKEN (secreto) o CLOUDFLARE_ACCOUNT_ID (variable) en el entorno produccion. No se despliega."
            echo "si=no" >> "$GITHUB_OUTPUT"
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.listo.outputs.si == 'si'
        with:
          # Lo que pasó el CI, no lo último de main. Con el commit anterior, para saber qué cambió.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        if: steps.listo.outputs.si == 'si'
      - uses: actions/setup-node@v6
        if: steps.listo.outputs.si == 'si'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: ¿Qué cambió?
        id: que
        if: steps.listo.outputs.si == 'si'
        env:
          A_MANO: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # A mano (workflow_dispatch) se despliega todo; al mergear, solo lo que tocó el merge.
          if [ "$A_MANO" = "true" ]; then que=todo; else que=$(git diff --name-only HEAD^1 HEAD | node scripts/que-desplegar.ts); fi
          echo "Archivos del merge:"; git diff --name-only HEAD^1 HEAD | sed 's/^/  /'
          echo "::notice::Se despliega: $que"
          echo "despliegue=$que" >> "$GITHUB_OUTPUT"
      - if: steps.listo.outputs.si == 'si' && steps.que.outputs.despliegue != 'nada'
        run: pnpm install --frozen-lockfile
      - if: steps.listo.outputs.si == 'si' && steps.que.outputs.despliegue != 'nada'
        env:
          DESPLIEGUE: ${{ steps.que.outputs.despliegue }}
        run: ./scripts/desplegar.sh "$DESPLIEGUE"
