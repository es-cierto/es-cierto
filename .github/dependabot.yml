# Actualizaciones de dependencias. El enfriamiento de 2 días respeta la regla de pnpm-workspace.yaml (nada publicado
# hace menos de 24 horas): sin él, el CI fallaría al instalar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 2 }
    groups:
      dependencias: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 2 }
    commit-message: { prefix: "chore(ci)" }
